openapi: 3.1.0
info:
  title: Boombox API
  version: 0.0.1
  description: |
    User-facing API of Boombox-server.

paths:
  /api/v1/status:
    get:
      summary: Get server status
      operationId: statusGet
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/statusGetResponse"

  /api/v1/admin/create:
    post:
      summary: Create admin account
      operationId: adminCreatePost
      requestBody:
        description: Create admin account request
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/adminCreatePostRequest"
      responses:
        "201":
          description: Successfully created admin account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/adminCreatePostResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/adminCreatePostResponse"
        "409":
          description: Admin account already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/adminCreatePostResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/adminCreatePostResponse"

components:
  schemas:
    statusGetResponse:
      type: object
      required: [status, payload]
      properties:
        status:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [OK]
            code:
              type: string
              enum: [SUCCESS]
            message:
              type: string
        payload:
          type: object
          required: [version]
          properties:
            version:
              type: string
              example: 0.0.1
    adminCreatePostRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,72}$
        password:
          type: string
          pattern: ^[\x20-\x7E]{1,72}$
    adminCreatePostResponse:
      type: object
      required: [status]
      properties:
        status:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [OK, KO]
            code:
              type: string
              enum: [SUCCESS, BAD_REQUEST, ADMIN_EXISTS, INTERNAL_ERR ]
            message:
              type: string
