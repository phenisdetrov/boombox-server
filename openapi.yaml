openapi: 3.1.0
info:
  title: Boombox API
  version: 0.1.0
  description: |
    User-facing API of Boombox-server.

paths:
  /api/v1/status:
    get:
      summary: Get server status
      operationId: statusGet
      responses:
        "200":
          description: Server is up
          content:
            $ref: "components/responces/status"
        "503":
          description: Server is down
          content:
            $ref: "components/responces/status"

components:
  schemas:
  responses:
    status:
      application/json:
        schema:
          type: object
          required: [status, version]
          properties:
            status:
              type: string
              enum: [KO, OK]
            version:
              type: string
              example: 0.0.1
